<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BADDIE B — Showroom Demo</title><style>*{box-sizing:border-box}body{margin:0;background:#fff9fb;color:#251923;font-family:system-ui,-apple-system,sans-serif}header{padding:25px 20px;text-align:center;background:#fff;border-bottom:1px solid #f3dce6}header b{font-size:30px;letter-spacing:5px;color:#e33582}header p{font-size:12px;letter-spacing:3px;color:#777}.wrap{max-width:1000px;margin:auto;padding:22px 15px}h1{font-size:23px;text-align:center}p.note{text-align:center;color:#777;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:25px}.rack{border:1px solid #f1d5e1;border-radius:16px;background:white;min-height:190px;cursor:pointer;padding:20px 10px;text-align:center;box-shadow:0 5px 20px #e5b9ce30}.rack .icon{font-size:68px;display:block;margin:15px}.rack strong{letter-spacing:2px}.rack small{display:block;color:#999;margin-top:6px}.back{border:0;background:#fce0ec;border-radius:22px;padding:12px 20px;cursor:pointer}.rail{display:flex;gap:15px;overflow-x:auto;scroll-snap-type:x mandatory;padding:24px 3px}.item{flex:0 0 175px;scroll-snap-align:center;border:1px solid #f2dce5;background:white;border-radius:16px;padding:15px;cursor:pointer;text-align:center}.hanger{font-size:80px;height:145px;display:grid;place-items:center;background:#fff4f8;border-radius:12px}.item strong{display:block;margin:12px 0 5px}.item span{color:#e33582}.overlay{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px}.modal{width:min(400px,100%);background:white;border-radius:22px;padding:25px;text-align:center;position:relative}.close{position:absolute;right:16px;top:12px;border:0;background:none;font-size:25px}.big{font-size:110px;background:#fff2f7;border-radius:15px;padding:25px}.buy{display:block;background:#e33582;color:white;padding:15px;border-radius:24px;margin-top:18px}footer{text-align:center;font-size:12px;color:#999;padding:30px}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.rack{min-height:250px}}</style></head><body><header><b>BADDIE Ⓑ</b><p>INTERACTIVE SHOWROOM · DEMO</p></header><main class="wrap" id="app"></main><footer>Prototype only · Sample products and prices · Not connected to live store</footer><div class="overlay" id="overlay" onclick="closeModal(event)"><div class="modal"><button class="close" onclick="closeModal()">×</button><div class="big" id="big"></div><h2 id="title"></h2><p id="price"></p><p>ตัวอย่างสินค้าเพื่อทดสอบการแสดงผล</p><div class="buy">ปุ่มสั่งซื้อ (Demo)</div></div></div><script>const cats=[['JACKETS','🧥'],['TOPS','👚'],['BOTTOMS','👖'],['DRESSES','👗']];const app=document.getElementById('app');function home(){app.innerHTML='<h1>CHOOSE YOUR RACK</h1><p class="note">แตะราวเสื้อผ้าที่ชอบเพื่อเลือกดูสินค้า</p><div class="grid">'+cats.map(([n,e],i)=>'<div class="rack" onclick="show('+i+')"><span class="icon">'+e+'</span><strong>'+n+'</strong><small>แตะเพื่อเข้าชม →</small></div>').join('')+'</div>'}function show(i){let [n,e]=cats[i];app.innerHTML='<button class="back" onclick="home()">← กลับไปเลือกราว</button><h1>'+n+'</h1><p class="note">ปัดซ้าย–ขวาเพื่อเลื่อนดูสินค้า แล้วแตะชิ้นที่สนใจ</p><div class="rail">'+Array.from({length:8},(_,j)=>'<div class="item" onclick="openModal('+i+','+j+')"><div class="hanger">'+e+'</div><strong>'+n+' '+String(j+1).padStart(2,'0')+'</strong><span>฿'+(390+j*100).toLocaleString()+'</span></div>').join('')+'</div>'}function openModal(i,j){document.getElementById('big').textContent=cats[i][1];document.getElementById('title').textContent=cats[i][0]+' '+String(j+1).padStart(2,'0');document.getElementById('price').textContent='฿'+(390+j*100).toLocaleString();document.getElementById('overlay').style.display='flex'}function closeModal(e){if(!e||e.target.id==='overlay'||e.target.className==='close')document.getElementById('overlay').style.display='none'}home();</script></body></html>
