<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BADDIE B Showroom</title><style>*{box-sizing:border-box}body{margin:0;background:#f7edf2;color:#30212a;font-family:system-ui}header{background:#fff9fc;padding:20px;display:flex;justify-content:space-between;align-items:center}header b{font-size:26px;letter-spacing:3px;color:#d21d69}header span{font-size:12px}h1{text-align:center;font:32px Georgia;margin:25px 0 5px}.sub{text-align:center;color:#8b7580;font-size:13px}.tabs{display:flex;gap:8px;overflow:auto;padding:18px 12px}.tabs button{white-space:nowrap;border:1px solid #e8cbd8;border-radius:30px;background:white;padding:12px 18px}.tabs .on{background:#2c1c25;color:white}.stage{height:60vh;min-height:440px;max-width:850px;margin:auto;position:relative;background:radial-gradient(ellipse at top,#fffafc,#f0e1e9);overflow:hidden}.bar{position:absolute;top:12%;left:6%;right:6%;height:12px;border-radius:20px;background:linear-gradient(#777,#fff,#888);box-shadow:0 5px 9px #0003}.pole{position:absolute;top:12%;height:82%;width:10px;background:linear-gradient(90deg,#888,#fff,#777)}.left{left:7%}.right{right:7%}.rail{position:absolute;inset:14% 9% 7%;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.item{flex:0 0 74%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;cursor:pointer}.hanger{height:45px;width:115px;position:relative;border-bottom:3px solid #a99da3;clip-path:polygon(50% 0,100% 100%,0 100%);background:linear-gradient(130deg,transparent 48%,#a99da3 49%,#a99da3 51%,transparent 52%)}.garment{height:78%;width:90%;filter:drop-shadow(7px 12px 7px #62404d55)}.garment svg{width:100%;height:100%}.tag{background:#fff;border-radius:30px;padding:9px 15px;font-size:12px;border:1px solid #ead5de}.arrows{position:absolute;top:50%;width:100%;display:flex;justify-content:space-between;pointer-events:none}.arrows button{pointer-events:auto;background:#fffffff0;border:0;border-radius:50%;height:46px;width:46px;font-size:27px}.hint{text-align:center;padding:18px;color:#856c79;font-size:12px}.modal{display:none;position:fixed;inset:0;background:#24141dbb;align-items:end;z-index:10}.sheet{background:white;width:100%;padding:25px;border-radius:25px 25px 0 0}.preview{height:36vh;background:#f6eaf0;display:flex;justify-content:center}.preview svg{height:100%}.sheet button{border:0;background:#d21d69;color:white;padding:14px;border-radius:30px;width:100%}@media(min-width:750px){.item{flex-basis:36%}.modal{align-items:center;justify-content:center}.sheet{max-width:430px;border-radius:25px}}</style><header><b>BADDIE Ⓑ</b><span>BE BOLD, BE YOU</span></header><h1>THE FASHION RACK</h1><p class="sub">เลือกหมวด แล้วปัดเสื้อผ้าบนราวเพื่อชมทีละชิ้น</p><div class="tabs" id="tabs"></div><section class="stage"><div class="bar"></div><div class="pole left"></div><div class="pole right"></div><div class="rail" id="rail"></div><div class="arrows"><button onclick="move(-1)">‹</button><button onclick="move(1)">›</button></div></section><p class="hint">← ปัดซ้าย–ขวา · แตะเสื้อผ้าเพื่อดูรายละเอียด →<br>DEMO: รูปทรงและราคาเป็นตัวอย่าง ยังไม่เชื่อมสินค้าจริง</p><div class="modal" id="modal" onclick="if(event.target===this)closeM()"><div class="sheet"><div class="preview" id="preview"></div><h2 id="name"></h2><p>ตัวอย่างการแสดงสินค้า · รอข้อมูลสินค้าจริง</p><button onclick="closeM()">กลับไปดูราวเสื้อผ้า</button></div></div><script>const cats=[['แจ็กเก็ต','j',7],['เสื้อ','t',10],['ยีนส์ & กางเกง','p',13],['เดรส','d',1]],colors=['#a74761','#dba0b7','#4d6a91','#c7a077','#383039','#99728e','#ba6c6c'];let active=0;function shape(t,c){let p=t==='d'?'<path d="M100 40H140L155 80L138 118L190 282Q120 302 50 282L102 118L85 80Z"/>':t==='p'?'<path d="M75 40H165L164 113L145 285H115L118 127L108 285H77L75 113Z"/>':t==='j'?'<path d="M92 38L68 53L34 126L61 145L80 103L78 265H162L160 103L179 145L206 126L172 53L148 38L120 81Z"/>':'<path d="M90 42L66 55L33 114L64 134L82 102L80 257H160L158 102L176 134L207 114L174 55L150 42Q120 70 90 42Z"/>';return '<svg viewBox="0 0 240 320"><g fill="'+c+'" stroke="#674b59" stroke-width="2">'+p+'</g><path d="M100 43Q120 78 140 43" fill="none" stroke="#fff8" stroke-width="4"/><path d="M85 110Q99 160 88 246M155 110Q140 160 152 246" fill="none" stroke="#fff4" stroke-width="7"/></svg>'}function draw(){tabs.innerHTML=cats.map((c,i)=>'<button class="'+(i===active?'on':'')+'" onclick="pick('+i+')">'+c[0]+' · '+c[2]+'</button>').join('');rail.innerHTML=Array.from({length:cats[active][2]},(_,i)=>'<div class="item" onclick="detail('+i+')"><div class="hanger"></div><div class="garment">'+shape(cats[active][1],colors[(i+active)%colors.length])+'</div><div class="tag">'+cats[active][0]+' '+(i+1)+' · ดูสินค้า ↗</div></div>').join('');rail.scrollLeft=0}function pick(i){active=i;draw()}function move(d){rail.scrollBy({left:d*rail.clientWidth*.75,behavior:'smooth'})}function detail(i){preview.innerHTML=shape(cats[active][1],colors[(i+active)%colors.length]);document.getElementById('name').textContent=cats[active][0]+' LOOK '+(i+1);modal.style.display='flex'}function closeM(){modal.style.display='none'}draw()</script>
